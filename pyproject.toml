# Installs cs-plugin, the tool that installs this workflow's Claude Code plugins.
# Nothing else here is Python: `uv run cs-plugin sync` is all it is for.
[project]
name = "atlas-brief-single"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cs-plugin==0.1.1"]

[tool.uv]
package = false

# cs-plugin is on TestPyPI for now. Once it is on PyPI, delete the two blocks
# below and run `uv lock`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
cs-plugin = { index = "testpypi" }
